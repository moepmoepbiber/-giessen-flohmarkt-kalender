name: Flohmarkt-Kalender aktualisieren

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kalender aktualisieren
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser
          import re

          URL = "https://www.antik-troedel-markt.de/aussteller-03.php"

          request = Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          html = urlopen(request, timeout=30).read().decode(
              "utf-8", errors="ignore"
          )

          # HTML-Tags entfernen
          text = re.sub(r"<script.*?</script>", " ", html, flags=re.S | re.I)
          text = re.sub(r"<style.*?</style>", " ", text, flags=re.S | re.I)
          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)

          # Nur Datumsangaben des Jahres 2026/2027/... finden.
          # Zusätzlich muss im näheren Text "Antik" oder "Trödel"
          # vorkommen.
          matches = re.finditer(
              r"(?i).{0,180}(?:antik|trödel).{0,180}?"
              r"(\d{1,2}\.\d{1,2}\.\d{4})",
              text
          )

          dates = set()

          for match in matches:
              date_text = match.group(1)

              try:
                  dt = datetime.strptime(
                      date_text,
                      "%d.%m.%Y"
                  )
                  dates.add(dt.strftime("%Y%m%d"))
              except ValueError:
                  pass

          # Falls die Seite das Datum vor "Antik & Trödel" nennt,
          # auch in die andere Richtung suchen.
          matches_reverse = re.finditer(
              r"(\d{1,2}\.\d{1,2}\.\d{4}).{0,180}"
              r"(?i:antik|trödel)",
              text
          )

          for match in matches_reverse:
              date_text = match.group(1)

              try:
                  dt = datetime.strptime(
                      date_text,
                      "%d.%m.%Y"
                  )
                  dates.add(dt.strftime("%Y%m%d"))
              except ValueError:
                  pass

          today = datetime.now().date()

          events = []

          for date_id in sorted(dates):
              dt = datetime.strptime(date_id, "%Y%m%d")

              if dt.date() < today:
                  continue

              uid = (
                  f"giessen-hessenhallen-{date_id}"
                  "@giessen-flohmarkt-kalender"
              )

              events.append(
                  "BEGIN:VEVENT\r\n"
                  f"UID:{uid}\r\n"
                  f"DTSTAMP:{datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')}\r\n"
                  f"DTSTART;TZID=Europe/Berlin:{date_id}T080000\r\n"
                  f"DTEND;TZID=Europe/Berlin:{date_id}T150000\r\n"
                  "SUMMARY:Antik & Trödel – Hessenhallen Gießen\r\n"
                  "LOCATION:Hessenhallen\\, An der Hessenhalle 11\\, 35398 Gießen\r\n"
                  "DESCRIPTION:Antik & Trödel – Hallenflohmarkt in den Hessenhallen Gießen.\r\n"
                  "END:VEVENT\r\n"
              )

          ics = (
              "BEGIN:VCALENDAR\r\n"
              "VERSION:2.0\r\n"
              "PRODID:-//Gießen Hessenhallen Flohmarkt//DE\r\n"
              "CALSCALE:GREGORIAN\r\n"
              "X-WR-CALNAME:Flohmarkt Hessenhallen Gießen\r\n"
              "X-WR-TIMEZONE:Europe/Berlin\r\n"
              + "".join(events) +
              "END:VCALENDAR\r\n"
          )

          with open(
              "flohmarkt.ics",
              "w",
              encoding="utf-8",
              newline=""
          ) as f:
              f.write(ics)

          print("Gefundene zukünftige Termine:")
          for date_id in sorted(dates):
              print(date_id)

          PY

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add flohmarkt.ics
          git diff --cached --quiet || git commit -m "Kalender automatisch aktualisiert"
          git push
