name: Flohmarkt-Kalender aktualisieren

on:
  schedule:
    - cron: "17 8 * * 1"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Veranstalterseite abrufen
        id: download
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import time

          url = "https://www.antik-troedel-markt.de/aussteller-03.php"

          headers = {
              "User-Agent":
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 "
                  "like Mac OS X) AppleWebKit/605.1.15 "
                  "(KHTML, like Gecko) Version/18.0 "
                  "Mobile/15E148 Safari/604.1"
          }

          for attempt in range(3):
              try:
                  print(f"Versuch {attempt + 1}/3")

                  request = Request(url, headers=headers)

                  with urlopen(request, timeout=20) as response:
                      data = response.read()

                  if len(data) < 1000:
                      raise RuntimeError(
                          "Antwort der Webseite ist ungewöhnlich kurz."
                      )

                  with open("veranstalterseite.html", "wb") as f:
                      f.write(data)

                  print(f"Erfolgreich geladen: {len(data)} Bytes")
                  break

              except Exception as error:
                  print(f"Fehler: {error}")

                  if attempt < 2:
                      print("Warte 5 Sekunden...")
                      time.sleep(5)

          else:
              print("Webseite konnte nicht abgerufen werden.")
              exit(1)
          PY

      - name: Bei Abruffehler alten Kalender behalten
        if: steps.download.outcome != 'success'
        run: |
          echo "Die Veranstalterseite war nicht erreichbar."
          echo "Die bestehende flohmarkt.ics bleibt unverändert."
          exit 0

      - name: Termine auswerten
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from html import unescape
          import re

          with open("veranstalterseite.html", "rb") as f:
              html = f.read().decode("utf-8", errors="ignore")

          text = re.sub(
              r"<script.*?</script>",
              " ",
              html,
              flags=re.S | re.I
          )

          text = re.sub(
              r"<style.*?</style>",
              " ",
              text,
              flags=re.S | re.I
          )

          text = re.sub(r"<[^>]+>", " ", text)
          text = unescape(text)
          text = re.sub(r"\s+", " ", text)

          found = set()

          patterns = [
              r"(?i)(?:antik|trödel).{0,250}?(\d{1,2}\.\d{1,2}\.\d{4})",
              r"(\d{1,2}\.\d{1,2}\.\d{4}).{0,250}?(?i:antik|trödel)"
          ]

          for pattern in patterns:
              for match in re.finditer(pattern, text):
                  try:
                      dt = datetime.strptime(
                          match.group(1),
                          "%d.%m.%Y"
                      )
                      found.add(dt.strftime("%Y%m%d"))
                  except ValueError:
                      pass

          today = datetime.now().date()

          future_dates = []

          for date_id in sorted(found):
              dt = datetime.strptime(date_id, "%Y%m%d")

              if dt.date() >= today:
                  future_dates.append(date_id)

          print("Gefundene Termine:")
          for date_id in future_dates:
              print(date_id)

          if not future_dates:
              raise RuntimeError(
                  "Keine zukünftigen Termine gefunden. "
                  "Bestehender Kalender bleibt erhalten."
              )

          events = []

          for date_id in future_dates:
              uid = (
                  f"giessen-hessenhallen-{date_id}"
                  "@giessen-flohmarkt-kalender"
              )

              now = datetime.now(
                  timezone.utc
              ).strftime("%Y%m%dT%H%M%SZ")

              events.append(
                  "BEGIN:VEVENT\r\n"
                  f"UID:{uid}\r\n"
                  f"DTSTAMP:{now}\r\n"
                  f"DTSTART;TZID=Europe/Berlin:{date_id}T080000\r\n"
                  f"DTEND;TZID=Europe/Berlin:{date_id}T150000\r\n"
                  "SUMMARY:Antik & Trödel – Hessenhallen Gießen\r\n"
                  "LOCATION:Hessenhallen\\, An der Hessenhalle 11\\, 35398 Gießen\r\n"
                  "DESCRIPTION:Antik & Trödel – Hallenflohmarkt in den Hessenhallen Gießen.\r\n"
                  "END:VEVENT\r\n"
              )

          ics = (
              "BEGIN:VCALENDAR\r\n"
              "VERSION:2.0\r\n"
              "PRODID:-//Gießen Hessenhallen Flohmarkt//DE\r\n"
              "CALSCALE:GREGORIAN\r\n"
              "X-WR-CALNAME:Flohmarkt Hessenhallen Gießen\r\n"
              "X-WR-TIMEZONE:Europe/Berlin\r\n"
              + "".join(events)
              + "END:VCALENDAR\r\n"
          )

          with open(
              "flohmarkt.ics",
              "w",
              encoding="utf-8",
              newline=""
          ) as f:
              f.write(ics)

          print(f"{len(events)} Termine in ICS geschrieben.")
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add flohmarkt.ics

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Kalender automatisch aktualisiert"
            git push
          fi
